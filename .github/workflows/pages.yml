# Construye el sitio Astro (sitio/) y lo publica en GitHub Pages en cada push a main.
# Indexable (decisión del 2026-10-20). Para el dominio final (Cloudflare): sin BASE_PATH y con PUBLIC_INDEXAR=true.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /dual-beauty-studio
          SITE_URL: https://cvalenciapatagonia.github.io
          PUBLIC_INDEXAR: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
